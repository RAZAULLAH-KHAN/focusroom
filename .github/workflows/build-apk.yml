name: Build FocusRoom Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up local Android SDK (automatically pre-installed on ubuntu runners)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Generate the Gradle Wrapper binary in the cloud
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2

      # 5. Make the gradlew shell script executable
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 6. Compile the application and build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. Upload the compiled APK file as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusroom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
