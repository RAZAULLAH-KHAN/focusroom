name: Build FocusRoom Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Make the gradlew shell script executable
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 4. Compile the application and build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Upload the compiled APK file as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusroom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

